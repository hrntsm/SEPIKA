[package]
name = "sepika-design-jp"
version = "0.0.1"
edition = "2021"
license = "MIT"

[dependencies]
sepika-core = { path = "../sepika-core" }
sepika-element = { path = "../sepika-element" }
sepika-solver = { path = "../sepika-solver" }
sepika-load = { path = "../sepika-load" }
serde = { workspace = true }

[dev-dependencies]
approx   = { workspace = true }
smallvec = { workspace = true }
# RC 簡易 Mu（rc_mu_simple）とファイバ解析 Mu（build_rc_member_skeleton）の突合テスト用。
# Layer 5（design-jp）→ Layer 0/2（material/skeleton）の dev-dependency は
# xtask check-deps のレイヤ規則上も問題ない（上位→下位のみ許可）。
sepika-material = { path = "../sepika-material" }
sepika-skeleton = { path = "../sepika-skeleton" }