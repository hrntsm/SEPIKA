[package]
name = "sepika-ai-connection"
version = "0.0.1"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
