name: 調査・検証（Investigation / Verification）
labels: ["調査・検証"]
description: 原典照合・仕様検討・独立検証・テスト追加の目的と確認事項を整理する
body:
  - type: markdown
    attributes:
      value: |
        何を明らかにするか、どの結果を何と比べるか、どこまで確認するかを記載してください。
        結論と根拠を得ることや、確定した仕様を継続して検証できる状態を完了条件にしてください。
        1 Issueで独立して完了を判断できる成果を1つに絞り、必要なテスト・文書更新も含めてください。
        種類ラベル「調査・検証」は自動付与されます。対象分野は[分類ルール](https://github.com/hrntsm/SEPIKA/blob/main/CONTRIBUTING.md#issue-の種類分野)に沿って手動設定してください。
        詳細な実装方法を先に決める必要はありません。
        [Issue の書き方](https://github.com/hrntsm/SEPIKA/blob/main/CONTRIBUTING.md#issue-の書き方) に従い、タイトルと冒頭は一般的な用語で記述し、内部実装用語は補足へ分けてください。
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 現状の疑問・課題と、調査や検証が必要な理由を記載してください。
      placeholder: "例: 規準の適用条件と現在の実装の対応が明確でなく、計算結果の妥当性を判断できない。"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 調査・検証の目的
      description: 明らかにしたいことや、確認できるようにしたい仕様・計算結果を記載してください。
      placeholder: "例: 適用すべき規準と条件を特定し、現在の実装に変更が必要か判断できる。"
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: 確認したい事項
      description: 今回確認する問い・対象・条件を記載してください。対象外があれば併せて示してください。
      placeholder: |
        - 対象となる規準の式と適用条件は何か。
        - 現在の実装と差異があるか。
        - 差異は安全側 / 危険側のどちらに影響しうるか。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 参照資料 / 関連コード
      description: 調査対象の資料・規準・コードがあれば記載してください。出典は名称・版・ページや条文を分かる範囲で示してください。
      placeholder: |
        資料・規準の名称 / 版 / ページ・条文:
        関連コード・文書のパスやリンク:
    validations:
      required: false
  - type: textarea
    id: decisions
    attributes:
      label: 結果を踏まえて決める事項
      description: 調査・検証の結果から決める仕様・採否・後続作業があれば記載してください。結論が未定でも構いません。
      placeholder: |
        - どの規準と適用条件を採用するか。
        - 実装変更や追加検証の Issue が必要か。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 得られる結論・根拠・検証結果や追加する試験について、何を確認できれば完了とするかを記載してください。
      placeholder: |
        - [ ] 確認事項への結論と出典・根拠が整理されている。
        - [ ] 検証・試験を追加する場合は、独立した期待値から対象の仕様を確認できる。
        - [ ] 追加調査や実装変更の要否が明確で、必要な文書や後続 Issue に結果が反映されている。
    validations:
      required: true
  - type: textarea
    id: related-issues
    attributes:
      label: 関連 Issue
      description: 親 Issue・関連する調査・後続作業などがあれば記載してください。
      placeholder: "例: 親 Issue #123、関連調査 #456"
    validations:
      required: false
