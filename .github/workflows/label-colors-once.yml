# Issue ラベル配色を一度だけ変更する一時ワークフロー（適用後に削除）
name: Issueラベル配色の一時更新

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/label-colors-once.yml

permissions:
  issues: write

jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - name: 種類を濃色・分野を淡色に統一
        uses: actions/github-script@v7
        with:
          script: |
            const colors = {
              "不具合": "D1242F",
              "調査": "0969DA",
              "機能追加・変更": "1A7F37",
              "性能改善": "BF8700",
              "管理": "57606A",
              "モデル": "DDF4FF",
              "荷重": "FFDDC2",
              "解析": "D6F5F1",
              "設計・検定": "EDE3FF",
              "GUI": "FFF2B3",
              "ST-Bridge": "DDEBD1"
            };
            for (const [name, color] of Object.entries(colors)) {
              await github.rest.issues.updateLabel({...context.repo, name, color});
              core.info(name + ": #" + color);
            }
