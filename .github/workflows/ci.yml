name: CI

# main への push では、テスト用依存ビルドキャッシュ（Swatinem/rust-cache、job id=test）の
# 生成・更新のためにテストジョブを実行する。GitHub Actions のキャッシュは base ブランチから
# PR へ復元できる一方、PR（merge ref）で保存したキャッシュはその PR からしか復元できない。
# そのため main 側でキャッシュを作り、新規 PR の初回実行から復元できるようにする。
# 品質ゲート（テスト実行・静的解析・ビルド確認）は従来どおり PR で実施する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR への新しい push 時に、進行中の古い実行をキャンセルする。main への連続 push でも
# 先行実行がキャンセルされうるが、キャンセルされた回のキャッシュ保存は行われず、次回の
# main 実行が生成・更新するため実害はない。
# 品質ゲートは PR で実施する。main への push ではテストジョブをキャッシュ生成用のビルドに
# 限定し（テスト実行なし）、docs デプロイ（docs.yml）は別 workflow で実行する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # main（push）ではキャッシュ生成に必要なビルドまでとし、テストの実行は PR に限定する。
  # --no-run はテストバイナリの実行だけを止め、依存のコンパイル内容・feature・profile は
  # PR 実行と同一で、キャッシュの再利用対象は変わらない。
  # 変数名は rust-cache がキャッシュキー（環境ハッシュ）に含める接頭辞
  # （CARGO / RUST / CC / CFLAGS / CXX / CMAKE）を避ける。接頭辞があると値が main と PR で
  # 異なるためキャッシュキーが一致しなくなる。
  TEST_BUILD_ONLY_ARGS: ${{ github.event_name == 'push' && '--no-run' || '' }}

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
      # main で復元したキャッシュが完全一致なら依存は揃っており、同一キーへの再保存は
      # できない（キャッシュは上書き不可）ためビルドをスキップする。PR では常に実行する。
      # キーは Cargo.lock / Cargo.toml / rustc 版 / キー対象 env 値で決まり、ci.yml の
      # コマンド・feature 指定の変更では変わらない。その場合も main は exact hit で
      # スキップし、キャッシュ更新は次にキーが変わる時まで遅延する（PR 側で不足分を
      # コンパイルするため正しさは維持される）。
      - name: テスト実行
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked $TEST_BUILD_ONLY_ARGS
      # mcp / gui は非デフォルト feature のため --workspace では検証されない。
      # sepika-io の results（Parquet 結果 I/O）も parquet feature 配下にあり、
      # -p 指定なしでは保証されないため合わせる（workspace 解決では mcp 経由で
      # 有効化されるが、明示指定で io 単体の検証も保証する）。
      # 過去に rmcp API 追従漏れでコンパイル不能のまま放置された経緯があり
      # （dev_docs/v_and_v/p8_review.md）、ここで明示的にビルド・テストして再発を防ぐ。
      # GUI コードのコンパイル漏れ（網羅的 match 等）の検知に加え、gui ゲート内の
      # ユニットテスト（viewer のカメラ計算等）も実行する（build は test に含まれる）。
      # 3 クレートを同一 Cargo 呼び出し（クレート名/機能名形式）にまとめ、
      # 同じ依存グラフの重複構築を避ける。default 構成は上の実行で別に検証する。
      - name: featureテスト実行（MCP/GUI/Parquet）
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test -p sepika-mcp -p sepika-app -p sepika-io --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked $TEST_BUILD_ONLY_ARGS
      # sepika-mcp が sepika-io/parquet を常時有効化しているため、
      # --workspace では feature 統一により sepika-io の default（parquet 無効）構成が
      # 独立には検証されない。Parquet 無効構成と、Arrow / Parquet を切り離した
      # GUI 開発ループ構成をそれぞれ直接保証するため、以下も別に実行する。
      - name: テスト実行（sepika-io の default 構成）
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test -p sepika-io --locked $TEST_BUILD_ONLY_ARGS
      - name: ビルド確認（GUI 単体・Parquet なし）
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo check -p sepika-app --features sepika-app/gui --locked

  clippy:
    name: Clippy静的解析
    # 品質ゲートは PR のみ。main への push ではテストジョブのみ実行する。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy実行
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 非デフォルト feature の mcp（bin ターゲット含む）と gui（eframe 経由の
      # GUI コード）に加え、sepika-io の results（Parquet 結果 I/O）も静的解析の
      # 対象にする。過去に GUI コードが網羅的 match 漏れで
      # コンパイル不能のまま放置された経緯があり（mn_view.rs）、ここで明示的に
      # 検証して再発を防ぐ。3 クレートを同一 Cargo 呼び出し（クレート名/機能名形式）に
      # まとめ、同じ依存グラフの重複構築を避ける。default 構成は上の実行で別に検証する。
      - name: Clippy実行（MCP/GUI/Parquet feature）
        run: cargo clippy -p sepika-mcp -p sepika-app -p sepika-io --all-targets --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked -- -D warnings

  fmt:
    name: フォーマットチェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: フォーマット確認
        run: cargo fmt --all -- --check

  audit:
    name: 脆弱性確認
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # rustsec/audit-check は警告を Check Run API で書き込むが、権限不足や
    # "Not Found" でジョブ自体が落ちることがある。CLI の cargo audit なら
    # 脆弱性の有無だけで exit code が決まり、警告（unmaintained 等）では落ちない。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: |
          # quick-xml の DoS 脆弱性。直接依存は 0.41 に更新済みだが、
          # wayland-scanner / zbus_xml（eframe 経由の推移的依存）が
          # まだ quick-xml ^0.39 を要求しているため、上流の更新待ち。
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  dependency-check:
    name: 依存性チェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny実行
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
