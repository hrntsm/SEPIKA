name: CI

on:
  # main への push は、新規 PR が復元するテスト用キャッシュ（rust-cache、shared-key=test）の
  # 生成・更新のため。品質ゲート（テスト実行・静的解析）は PR でのみ実施する。
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR への新しい push 時に、進行中の古い実行をキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # main は品質ゲートではなくキャッシュ生成のみを担うため、1 ジョブで直列に全構成を --no-run で
  # ビルドして単一のキャッシュへまとめる。PR 側の復元元を 1 つに保つため、構成ごとに
  # shared-key を分けない。
  test-cache:
    name: テスト（キャッシュ生成）
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # shared-key は job id の代わりにキーへ入る。job id を test から変更しても、
      # 既存の main キャッシュ（v0-rust-test-...）をそのまま復元するため test を指定する。
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: test
      # 完全一致で復元できた場合、同一キーへは再保存できない（キャッシュは上書き不可）ためスキップする。
      - name: テストビルド
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked --no-run
      # MCP / GUI は非デフォルト feature のため --workspace では検証されない。
      - name: featureテストビルド（MCP/GUI/Parquet）
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test -p sepika-mcp -p sepika-app -p sepika-io --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked --no-run
      # feature 統一により --workspace では sepika-io の default（parquet 無効）構成が
      # 検証されないため、parquet 無効構成と GUI 単体構成を以下で直接検証する。
      - name: テストビルド（sepika-io の default 構成）
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test -p sepika-io --locked --no-run
      - name: ビルド確認（GUI 単体・Parquet なし）
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo check -p sepika-app --features sepika-app/gui --locked

  # PR は 4 構成を独立ジョブで並列実行する。各ジョブは main の同一キャッシュを復元するだけで、
  # 保存はしない（同一キーへの競合保存を避ける）。
  test:
    name: テスト（${{ matrix.name }}）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            command: cargo test --workspace --locked
          - name: MCP/GUI/Parquet feature
            command: cargo test -p sepika-mcp -p sepika-app -p sepika-io --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked
          - name: sepika-io default
            command: cargo test -p sepika-io --locked
          - name: GUI 単体 check
            command: cargo check -p sepika-app --features sepika-app/gui --locked
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.event_name == 'push' }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # ブランチ保護の必須チェック名「テスト」を維持するための集約ジョブ。matrix のいずれかが
  # 失敗・キャンセルされた場合に失敗する。
  test-gate:
    name: テスト
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 検証結果
        if: needs.test.result != 'success'
        run: exit 1

  clippy:
    name: Clippy静的解析
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy実行
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # MCP / GUI は非デフォルト feature のため --workspace の Clippy では検証されない。
      - name: Clippy実行（MCP/GUI/Parquet feature）
        run: cargo clippy -p sepika-mcp -p sepika-app -p sepika-io --all-targets --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked -- -D warnings

  fmt:
    name: フォーマットチェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: フォーマット確認
        run: cargo fmt --all -- --check

  audit:
    name: 脆弱性確認
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # rustsec/audit-check は権限不足や "Not Found" でジョブ自体が落ちることがあるため、
    # 脆弱性の有無のみで exit code が決まる CLI の cargo audit を使う。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: |
          # quick-xml の DoS（推移的依存の wayland-scanner / zbus_xml が ^0.39 を要求）は
          # 上流の更新待ちのため無視する。
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  dependency-check:
    name: 依存性チェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny実行
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
