name: CI

on:
  pull_request:
    branches: [main]

# 同一 PR への新しい push 時に、進行中の古い実行をキャンセルする。
# 品質ゲートは PR マージ前のみ。main へのマージ後は docs デプロイ（docs.yml）のみ実行する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 一時診断（#645 Linux・Windows 同版比較）
        shell: bash
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          RUSTUP_TOOLCHAIN: "1.99.0"
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustc -vV | tee "$RUNNER_TEMP/issue645-rustc-version.txt"
          grep -Fx 'release: 1.99.0' "$RUNNER_TEMP/issue645-rustc-version.txt"
          grep -Fx 'commit-hash: b940084d7eb6a299eb4bfeb8e34901bc051e7ac4' "$RUNNER_TEMP/issue645-rustc-version.txt"
          grep -Fx 'LLVM version: 23.1.1' "$RUNNER_TEMP/issue645-rustc-version.txt"
          grep -Fx 'host: x86_64-unknown-linux-gnu' "$RUNNER_TEMP/issue645-rustc-version.txt"
          cargo -V
          rustc --print cfg
          git rev-parse HEAD
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
          env | sort | grep -E '^(RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|RUSTUP_TOOLCHAIN|CARGO_PROFILE_|CARGO_BUILD_|RUSTC=|RUSTC_WRAPPER=|RUSTC_WORKSPACE_WRAPPER=)' || true
          sha256sum Cargo.toml Cargo.lock crates/sepika-load/Cargo.toml crates/sepika-load/src/floor/mod.rs crates/sepika-load/src/floor/geometry.rs crates/sepika-load/src/floor/tests.rs crates/sepika-core/src/geom/vec3.rs
          cargo test -p sepika-load --lib --locked -vv floor::tests::issue645_windows_profile_probe -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/issue645-linux-probe.log"
      - name: テスト実行
        run: cargo test --workspace --locked
      # mcp / gui は非デフォルト feature のため --workspace では検証されない。
      # sepika-io の results（Parquet 結果 I/O）も parquet feature 配下にあり、
      # -p 指定なしでは保証されないため合わせる（workspace 解決では mcp 経由で
      # 有効化されるが、明示指定で io 単体の検証も保証する）。
      # 過去に rmcp API 追従漏れでコンパイル不能のまま放置された経緯があり
      # （dev_docs/v_and_v/p8_review.md）、ここで明示的にビルド・テストして再発を防ぐ。
      # GUI コードのコンパイル漏れ（網羅的 match 等）の検知に加え、gui ゲート内の
      # ユニットテスト（viewer のカメラ計算等）も実行する（build は test に含まれる）。
      # 3 クレートを同一 Cargo 呼び出し（クレート名/機能名形式）にまとめ、
      # 同じ依存グラフの重複構築を避ける。default 構成は上の実行で別に検証する。
      - name: featureテスト実行（MCP/GUI/Parquet）
        run: cargo test -p sepika-mcp -p sepika-app -p sepika-io --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked
      # sepika-mcp が sepika-io/parquet を常時有効化しているため、
      # --workspace では feature 統一により sepika-io の default（parquet 無効）構成が
      # 独立には検証されない。Parquet 無効構成と、Arrow / Parquet を切り離した
      # GUI 開発ループ構成をそれぞれ直接保証するため、以下も別に実行する。
      - name: テスト実行（sepika-io の default 構成）
        run: cargo test -p sepika-io --locked
      - name: ビルド確認（GUI 単体・Parquet なし）
        run: cargo check -p sepika-app --features sepika-app/gui --locked

  clippy:
    name: Clippy静的解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy実行
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 非デフォルト feature の mcp（bin ターゲット含む）と gui（eframe 経由の
      # GUI コード）に加え、sepika-io の results（Parquet 結果 I/O）も静的解析の
      # 対象にする。過去に GUI コードが網羅的 match 漏れで
      # コンパイル不能のまま放置された経緯があり（mn_view.rs）、ここで明示的に
      # 検証して再発を防ぐ。3 クレートを同一 Cargo 呼び出し（クレート名/機能名形式）に
      # まとめ、同じ依存グラフの重複構築を避ける。default 構成は上の実行で別に検証する。
      - name: Clippy実行（MCP/GUI/Parquet feature）
        run: cargo clippy -p sepika-mcp -p sepika-app -p sepika-io --all-targets --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked -- -D warnings

  fmt:
    name: フォーマットチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: フォーマット確認
        run: cargo fmt --all -- --check

  audit:
    name: 脆弱性確認
    runs-on: ubuntu-latest
    # rustsec/audit-check は警告を Check Run API で書き込むが、権限不足や
    # "Not Found" でジョブ自体が落ちることがある。CLI の cargo audit なら
    # 脆弱性の有無だけで exit code が決まり、警告（unmaintained 等）では落ちない。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: |
          # quick-xml の DoS 脆弱性。直接依存は 0.41 に更新済みだが、
          # wayland-scanner / zbus_xml（eframe 経由の推移的依存）が
          # まだ quick-xml ^0.39 を要求しているため、上流の更新待ち。
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  dependency-check:
    name: 依存性チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny実行
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
