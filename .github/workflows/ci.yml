name: CI

on:
  # main への push は、新規 PR が復元するテスト用キャッシュ（rust-cache、job id=test）の
  # 生成・更新のため。品質ゲート（テスト実行・静的解析）は PR でのみ実施する。
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR への新しい push 時に、進行中の古い実行をキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # main では --no-run（テスト実行のみ省略。ビルド内容は PR と同一）。変数名は rust-cache が
  # キーに含める接頭辞（CARGO / RUST / CC / CFLAGS / CXX / CMAKE）を避ける（main と PR で値が
  # 異なるとキーが食い違うため）。
  TEST_BUILD_ONLY_ARGS: ${{ github.event_name == 'push' && '--no-run' || '' }}

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
      # 完全一致で復元できた場合、同一キーへは再保存できない（キャッシュは上書き不可）ためスキップする。
      - name: テスト実行
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked $TEST_BUILD_ONLY_ARGS
      # MCP / GUI は非デフォルト feature のため --workspace では検証されない。
      - name: featureテスト実行（MCP/GUI/Parquet）
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test -p sepika-mcp -p sepika-app -p sepika-io --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked $TEST_BUILD_ONLY_ARGS
      # feature 統一により --workspace では sepika-io の default（parquet 無効）構成が
      # 検証されないため、parquet 無効構成と GUI 単体構成を以下で直接検証する。
      - name: テスト実行（sepika-io の default 構成）
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test -p sepika-io --locked $TEST_BUILD_ONLY_ARGS
      - name: ビルド確認（GUI 単体・Parquet なし）
        if: github.event_name == 'pull_request' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo check -p sepika-app --features sepika-app/gui --locked

  clippy:
    name: Clippy静的解析
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy実行
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # MCP / GUI は非デフォルト feature のため --workspace の Clippy では検証されない。
      - name: Clippy実行（MCP/GUI/Parquet feature）
        run: cargo clippy -p sepika-mcp -p sepika-app -p sepika-io --all-targets --features sepika-mcp/mcp,sepika-app/gui,sepika-io/parquet --locked -- -D warnings

  fmt:
    name: フォーマットチェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: フォーマット確認
        run: cargo fmt --all -- --check

  audit:
    name: 脆弱性確認
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # rustsec/audit-check は権限不足や "Not Found" でジョブ自体が落ちることがあるため、
    # 脆弱性の有無のみで exit code が決まる CLI の cargo audit を使う。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: |
          # quick-xml の DoS（推移的依存の wayland-scanner / zbus_xml が ^0.39 を要求）は
          # 上流の更新待ちのため無視する。
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  dependency-check:
    name: 依存性チェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny実行
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
