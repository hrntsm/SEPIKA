[book]
title = "SEPIKA ドキュメント"
description = "日本の建築構造計算一貫プログラム SEPIKA の利用者向けドキュメント（計算根拠・理論・出典）"
authors = ["SEPIKA contributors"]
language = "ja"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/hrntsm/SEPIKA"
edit-url-template = "https://github.com/hrntsm/SEPIKA/edit/main/docs/{path}"
mathjax-support = true
# 全ページ末尾に MIT License と無保証の注意書き（`docs/introduction.md` へのリンク）を出す。
additional-css = ["theme/footer.css", "theme/impl-ref.css"]
additional-js = ["theme/footer.js"]

# 章トップ（`README.md`）は `index.html` として出力される一方、目次・本文中の
# `README.md` リンクは `README.html` のまま解決されるため、リダイレクトで受ける。
# 章ディレクトリを追加したら、ここにも 1 行追加する。
[output.html.redirect]
"/model_io/README.html" = "index.html"
"/model_edit/README.html" = "index.html"
"/mcp_server/README.html" = "index.html"
"/preparation/README.html" = "index.html"
"/result_view/README.html" = "index.html"
"/calc_basis/README.html" = "index.html"
"/calc_basis/01_荷重/README.html" = "index.html"
"/calc_basis/02_材料/README.html" = "index.html"
"/calc_basis/03_断面性能/README.html" = "index.html"
"/calc_basis/04_要素剛性/README.html" = "index.html"
"/calc_basis/05_構造解析/README.html" = "index.html"
"/calc_basis/06_一次設計/README.html" = "index.html"
"/calc_basis/07_二次設計/README.html" = "index.html"
"/calc_basis/08_部材終局耐力/README.html" = "index.html"
"/calc_basis/09_免震制振/README.html" = "index.html"
"/calc_basis/10_数量積算/README.html" = "index.html"

"/elastic/README.html" = "index.html"
"/workflow/README.html" = "index.html"
"/section_study/README.html" = "index.html"
"/nonlinear/README.html" = "index.html"
"/external/README.html" = "index.html"
"/model_edit/10_断面案の検討.html" = "../section_study/01_断面案の検討.html"
"/calc_basis/02_材料/01_一軸材料構成則.html" = "../../nonlinear/01_一軸材料構成則.html"
"/calc_basis/02_材料/02_部材履歴則.html" = "../../nonlinear/02_部材履歴則.html"
"/calc_basis/03_断面性能/07_ファイバー断面.html" = "../../nonlinear/03_ファイバー断面.html"
"/calc_basis/04_要素剛性/09_非線形梁要素のモデル化.html" = "../../nonlinear/04_非線形梁要素のモデル化.html"
"/calc_basis/08_部材終局耐力/04_RC_部材_非線形復元力特性.html" = "../../nonlinear/05_RC_部材_非線形復元力特性.html"
"/calc_basis/09_免震制振/03_座屈拘束ブレース.html" = "../06_一次設計/06_座屈拘束ブレース.html"

"/calc_basis/04_要素剛性/10_RC壁の壁脚内力と初期耐力.html" = "../08_部材終局耐力/08_RC壁の壁脚内力と初期耐力.html"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
